$kind: http-request
url: "{{baseUrl}}/api/notes?q=meeting"
method: GET
queryParams:
  q: meeting
scripts:
  - type: afterResponse
    code: |-
      pm.test('Search succeeds', () => pm.response.to.have.status(200));
      pm.test('Matching meeting notes returned', () => pm.expect(pm.response.json().count).to.be.above(0));
    language: text/javascript
order: 5000
